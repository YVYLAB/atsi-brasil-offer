<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — Página não encontrada</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:#101820;color:#f3f6fa;font:16px/1.6 system-ui,sans-serif}
    main{width:100%;max-width:540px;padding:clamp(24px,6vw,48px);border:1px solid #354552;border-radius:24px;background:#192630}
    .code{margin:0;color:#a8bac9;font-size:clamp(64px,16vw,104px);font-weight:800;line-height:1}
    h1{font-size:clamp(24px,6vw,32px);line-height:1.2;margin:22px 0 16px}
    p{color:#c1ccd5;margin:12px 0}
  </style>
</head>
<body>
  <main aria-labelledby="notFoundTitle">
    <p class="code" aria-hidden="true">404</p>
    <h1 id="notFoundTitle">Página não encontrada</h1>
    <p>O link acessado não identifica uma empresa válida.</p>
    <p>Confira o endereço recebido ou solicite um novo link a quem enviou a apresentação.</p>
  </main>
</body>
</html>
